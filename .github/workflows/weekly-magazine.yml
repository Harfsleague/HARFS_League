name: Weekly HARFS Magazine

# Iran no longer observes DST (fixed UTC+3:30 year-round since 2022),
# so 09:00 Asia/Tehran is always 05:30 UTC. Cron below runs every Friday.
on:
  schedule:
    - cron: "30 5 * * 5"
  workflow_dispatch: {}   # lets you trigger a test run manually from the Actions tab

jobs:
  build-magazine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (for the generator script)
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate this week's magazine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HARFS_DATA_TOKEN: ${{ secrets.HARFS_DATA_TOKEN }}
        run: node scripts/generate-magazine.mjs
