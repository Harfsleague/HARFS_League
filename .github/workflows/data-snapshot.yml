name: Data snapshot

# Keeps data/snapshot.json (a one-file copy of the league data, used to make a device's first visit fast) up to date.
# Runs every 15 minutes and can be started by hand from the Actions tab ("Run workflow").
# It only commits when the data really changed.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: data-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build snapshot
        env:
          HARFS_DATA_TOKEN: ${{ secrets.HARFS_DATA_TOKEN }}
        run: node scripts/build-snapshot.mjs

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/snapshot.json)" ]; then
            git config user.name "harfs-snapshot-bot"
            git config user.email "harfs-snapshot-bot@users.noreply.github.com"
            git add data/snapshot.json
            git commit -m "Update data snapshot"
            git pull --rebase
            git push
          else
            echo "No change."
          fi
